services:
  - type: web
    name: paipai-charge-game
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: paipai-charge-training-db
          property: connectionString

databases:
  - name: paipai-charge-training-db
    plan: free
    databaseName: paipai_charge
